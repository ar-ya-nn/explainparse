name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Grammars are LL(1)
        run: |
          python -m explainparse --grammar --lang lumen | tail -1
          python -m explainparse --grammar --lang minic | tail -1
          python -m explainparse --grammar --lang minijava | tail -1
      - name: Mutation evaluation
        run: python -m explainparse.evaluate examples/corpus --per-type 60 --seed 7
